name: Terraform apply

# Manual only. The Environment `aws` (required reviewer, restricted to main)
# is the approval gate; the apply role trusts nothing else.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to run against envs/aws"
        type: choice
        options:
          - apply
          - destroy
        default: apply

permissions:
  contents: read

jobs:
  terraform:
    name: ${{ inputs.action }}
    # Defence in depth: the Environment is already limited to main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: aws
    permissions:
      contents: read
      id-token: write
    # Same group as the PR plan: only one run at a time on the state
    concurrency:
      group: terraform-envs-aws
      cancel-in-progress: false
    env:
      ACTION: ${{ inputs.action }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: "^1.16.0"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: arn:aws:iam::035074950804:role/github-actions-apply
          aws-region: eu-north-1

      - name: init
        working-directory: envs/aws
        run: terraform init -input=false

      - name: plan
        working-directory: envs/aws
        run: |
          set -o pipefail
          flags=""
          [ "$ACTION" = "destroy" ] && flags="-destroy"
          terraform plan -input=false -no-color -lock-timeout=60s $flags \
            -out="$RUNNER_TEMP/tfplan" | tee "$RUNNER_TEMP/plan.txt"

      - name: plan to job summary
        if: always()
        run: |
          {
            echo "## terraform $ACTION · envs/aws"
            echo '```'
            tail -c 60000 "$RUNNER_TEMP/plan.txt" 2>/dev/null || echo 'no plan output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Applies exactly the saved plan, never a fresh one
      - name: apply
        working-directory: envs/aws
        run: terraform apply -input=false -no-color -lock-timeout=60s "$RUNNER_TEMP/tfplan"

      - name: outputs to job summary
        if: inputs.action == 'apply'
        working-directory: envs/aws
        run: |
          {
            echo '## outputs'
            echo '```'
            terraform output -no-color
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
